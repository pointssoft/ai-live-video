name: Build and push GPU worker

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Docker release tag
        required: true
        default: phase1
        type: string
  push:
    branches:
      - main
    paths:
      - docker/worker.Dockerfile
      - worker/**
      - mimicmotion/**
      - inference.py
      - constants.py
      - .github/workflows/build-worker.yml

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-worker:
    name: Build linux/amd64 worker
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mimicmotion-worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force || true
          df -h

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || {
            echo "DOCKERHUB_USERNAME is not configured"
            exit 1
          }
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || {
            echo "DOCKERHUB_TOKEN is not configured"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="${INPUT_TAG:-phase1}"
          if [[ ! "$release_tag" =~ ^[a-zA-Z0-9._-]{1,128}$ ]]; then
            echo "Invalid Docker tag: $release_tag"
            exit 1
          fi
          {
            echo "release_tag=$release_tag"
            echo "short_sha=${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.release_tag }}
            ${{ env.IMAGE_NAME }}:phase1-smoke
            ${{ env.IMAGE_NAME }}:sha-${{ steps.tags.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo "## GPU worker image"
            echo
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Release tag: \`${{ steps.tags.outputs.release_tag }}\`"
            echo "- Smoke tag: \`phase1-smoke\`"
            echo "- Commit tag: \`sha-${{ steps.tags.outputs.short_sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platform: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"
