name: Deploy realtime worker to Runpod Pod

on:
  workflow_run:
    workflows:
      - Build and push realtime worker
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable realtime worker tag (sha- followed by 12 lowercase hex characters)
        required: true
        type: string
      gpu_type_id:
        description: Runpod GPU type ID
        required: true
        default: NVIDIA H100 SXM
        type: string

concurrency:
  group: realtime-worker-runpod-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-realtime-worker:
    name: Deploy persistent H100 Pod
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_REALTIME_POD_ID: ${{ secrets.RUNPOD_REALTIME_POD_ID }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}

    steps:
      - name: Resolve immutable image and GPU
        id: config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_GPU_TYPE_ID: ${{ inputs.gpu_type_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            tag="sha-${WORKFLOW_HEAD_SHA:0:12}"
            revision="$WORKFLOW_HEAD_SHA"
            gpu_type_id="NVIDIA L40S"
          else
            tag="$INPUT_IMAGE_TAG"
            revision="manual"
            gpu_type_id="${INPUT_GPU_TYPE_ID:-NVIDIA L40S}"
          fi
          [[ "$tag" =~ ^sha-[0-9a-f]{12}$ ]] || { echo "Image tag must match sha-<12 lowercase hex>"; exit 1; }
          [[ "$gpu_type_id" =~ ^[A-Za-z0-9._[:space:]-]{3,100}$ ]] || { echo "Invalid GPU type ID"; exit 1; }
          {
            echo "image=${DOCKERHUB_USERNAME}/mimicmotion-realtime-worker:${tag}"
            echo "revision=$revision"
            echo "gpu_type_id=$gpu_type_id"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Runpod and LiveKit configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$RUNPOD_API_KEY" ]] || missing+=(RUNPOD_API_KEY)
          [[ -n "$DOCKERHUB_USERNAME" ]] || missing+=(DOCKERHUB_USERNAME)
          [[ -n "$LIVEKIT_URL" ]] || missing+=(LIVEKIT_URL)
          [[ -n "$LIVEKIT_API_KEY" ]] || missing+=(LIVEKIT_API_KEY)
          [[ -n "$LIVEKIT_API_SECRET" ]] || missing+=(LIVEKIT_API_SECRET)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production secrets: %s\\n' "${missing[*]}"
            exit 1
          fi

      - name: Stop previous realtime Pod
        if: env.RUNPOD_REALTIME_POD_ID != ''
        shell: bash
        env:
          POD_ID: ${{ env.RUNPOD_REALTIME_POD_ID }}
        run: |
          set -euo pipefail
          payload='{"query":"mutation($input: PodStopInput!) { podStop(input: $input) { id desiredStatus } }","variables":{"input":{"podId":"'"$POD_ID"'"}}}'
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'content-type: application/json' \
            --url "https://api.runpod.io/graphql?api_key=${RUNPOD_API_KEY}" \
            --data "$payload")"
          echo "$response" | jq -e '.data.podStop.id == $ENV.POD_ID' >/dev/null || {
            echo "Runpod did not stop the expected Pod"
            echo "$response"
            exit 1
          }

      - name: Create H100 realtime Pod
        id: pod
        shell: bash
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          GPU_TYPE_ID: ${{ steps.config.outputs.gpu_type_id }}
        run: |
          set -euo pipefail
          export POD_NAME="mimicmotion-realtime-${GITHUB_SHA:0:12}"
          export POD_ENV="$(jq -cn \
            --arg url "$LIVEKIT_URL" \
            --arg key "$LIVEKIT_API_KEY" \
            --arg secret "$LIVEKIT_API_SECRET" \
            '[
              {key: "LIVEKIT_URL", value: $url},
              {key: "LIVEKIT_API_KEY", value: $key},
              {key: "LIVEKIT_API_SECRET", value: $secret},
              {key: "LIVEKIT_AGENT_NAME", value: "liveportrait"}
            ]')"
          input="$(jq -cn \
            --arg cloudType 'ALL' \
            --arg gpuTypeId "$GPU_TYPE_ID" \
            --arg name "$POD_NAME" \
            --arg imageName "$IMAGE" \
            --arg ports '8081/http' \
            --arg volumeMountPath '/workspace' \
            --argjson env "$POD_ENV" \
            '{cloudType: $cloudType, gpuCount: 1, volumeInGb: 40, containerDiskInGb: 100, minVcpuCount: 20, minMemoryInGb: 125, gpuTypeId: $gpuTypeId, name: $name, imageName: $imageName, dockerArgs: "", ports: $ports, volumeMountPath: $volumeMountPath, env: $env}')"
          payload="$(jq -cn --arg query 'mutation($input: PodFindAndDeployOnDemandInput!) { podFindAndDeployOnDemand(input: $input) { id imageName machineId machine { podHostId } } }' --argjson input "$input" '{query: $query, variables: {input: $input}}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'content-type: application/json' \
            --url "https://api.runpod.io/graphql?api_key=${RUNPOD_API_KEY}" \
            --data "$payload")"
          pod_id="$(echo "$response" | jq -r '.data.podFindAndDeployOnDemand.id // empty')"
          if [[ -z "$pod_id" || "$response" == *'"errors"'* ]]; then
            echo "Runpod Pod creation failed:"
            echo "$response"
            exit 1
          fi
          {
            echo "pod_id=$pod_id"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Runpod realtime Pod deployment"
            echo
            echo "- Pod: \`${{ steps.pod.outputs.pod_id }}\`"
            echo "- Image: \`${{ steps.pod.outputs.image }}\`"
            echo "- GPU: \`${{ steps.config.outputs.gpu_type_id }}\`"
            echo "- Source revision: \`${{ steps.config.outputs.revision }}\`"
            echo
            echo "Set the new Pod ID as the production secret \`RUNPOD_REALTIME_POD_ID\` before the next deployment."
          } >> "$GITHUB_STEP_SUMMARY"
