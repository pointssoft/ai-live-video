[project]
name = "mimicmotion-api"
version = "0.1.0"
description = "MimicMotion platform API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.29,<1",
  "boto3>=1.34,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.43.71",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
