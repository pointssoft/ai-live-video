services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mimicmotion
      POSTGRES_USER: mimicmotion
      POSTGRES_PASSWORD: mimicmotion_local
    ports:
      - "5432:5432"
    volumes:
      - mimicmotion-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimicmotion -d mimicmotion"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-local
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mimicmotion-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin-local &&
      mc mb --ignore-existing local/mimicmotion-local &&
      mc anonymous set none local/mimicmotion-local
      "

  media-validator:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: >
      sh -c "alembic -c apps/api/alembic.ini upgrade head &&
      python -m app.tasks.media_validation"
    environment:
      DATABASE_URL: postgresql+asyncpg://mimicmotion:mimicmotion_local@postgres:5432/mimicmotion
      AUTH_TOKEN_PEPPER: local-development-pepper-32-bytes-minimum
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: mimicmotion-local
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin-local
      S3_FORCE_PATH_STYLE: "true"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mimicmotion-postgres-data:
  mimicmotion-minio-data:
